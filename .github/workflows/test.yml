name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; else brew install ffmpeg; fi
      - name: Show tool versions
        run: |
          node --version
          ffmpeg -version | head -1
          (google-chrome --version || "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version) 2>/dev/null || echo "chrome not on PATH"
      - name: Tests
        run: node --test test.ts
      - name: Render the example
        run: node vw.ts render example/timeline.ts --fps 5 --output hello.mp4
